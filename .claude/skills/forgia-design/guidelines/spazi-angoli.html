<!doctype html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;min-height:100vh}.m{font:var(--t-etichetta);letter-spacing:var(--t-etichetta-spaziatura);text-transform:uppercase;color:var(--testo-2)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:64px;border-radius:var(--r-1)}.sw b{font:600 12px/1.2 var(--font-sans)}.sw span{font:400 11px/1.2 var(--font-mono);color:var(--testo-2)}</style></head><body>
<div style="display:flex;gap:20px;align-items:center"><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><i style="width:72px;height:56px;border-radius:var(--r-1);background:var(--superficie);border:var(--bordo-forte)"></i><span style="font:400 10.5px var(--font-mono);color:var(--testo-2)">--r-1 2px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><i style="width:72px;height:56px;border-radius:var(--r-2);background:var(--superficie);border:var(--bordo-forte)"></i><span style="font:400 10.5px var(--font-mono);color:var(--testo-2)">--r-2 4px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><i style="width:72px;height:56px;border-radius:var(--r-3);background:var(--superficie);border:var(--bordo-forte)"></i><span style="font:400 10.5px var(--font-mono);color:var(--testo-2)">--r-3 8px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><i style="width:72px;height:56px;border-radius:var(--r-icona);background:var(--superficie);border:var(--bordo-forte)"></i><span style="font:400 10.5px var(--font-mono);color:var(--testo-2)">--r-icona 14px</span></div><div style="display:flex;flex-direction:column;gap:6px;margin-left:12px;font:400 11px var(--font-mono);color:var(--testo-2)"><span style="border-bottom:var(--bordo);padding-bottom:4px">--linea 16%</span><span style="border-bottom:var(--bordo-forte);padding-bottom:4px">--linea-forte 34%</span></div></div>
</body></html>
