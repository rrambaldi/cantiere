<!doctype html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:0;min-height:100vh;background:var(--carta-50)}
.tav{margin:16px 20px;border-radius:var(--r-3);overflow:hidden;background-color:var(--prussia-700);background-image:linear-gradient(var(--griglia) 1px,transparent 1px),linear-gradient(90deg,var(--griglia) 1px,transparent 1px);background-size:32px 32px}
.n{height:16px;background:repeating-linear-gradient(-45deg,var(--giallo-500) 0 14px,var(--prussia-700) 14px 28px)}
.c{height:212px;display:flex;align-items:center;justify-content:center;gap:28px}
.w{font:600 76px/1 var(--font-mono);letter-spacing:-.04em;color:var(--carta-50)}</style></head><body>
<div class="tav"><div class="n"></div><div class="c"><img src="../assets/logo/forgia-scuro.svg" width="112" height="112" alt=""><span class="w">forgia</span></div></div>
</body></html>
