<!doctype html><html lang="it"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.2/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px 24px}.l{font:var(--t-etichetta);letter-spacing:var(--t-etichetta-spaziatura);text-transform:uppercase;color:var(--testo-2)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = (() => { for (const k of Object.keys(window)) { try { const v = window[k]; if (v && v !== window && typeof v === 'object' && !(v instanceof Window) && v.Logo) return v; } catch (e) {} } return null; })();
if (!NS) { document.getElementById('root').innerHTML = '<p style="font:var(--t-piccolo);color:var(--testo-2)">Bundle dei componenti non ancora generato.</p>'; throw new Error('bundle mancante'); }
const { Logo } = NS;
function Card(){ return <div style={{display:'flex',gap:16}}>
<div style={{flex:1,display:'flex',flexDirection:'column',gap:18,justifyContent:'center',padding:'20px 24px',background:'var(--sfondo)',borderRadius:4}}><Logo size={48} wordmark/><div style={{display:'flex',gap:16,alignItems:'flex-end'}}><Logo size={32}/><Logo size={16}/><Logo size={32} mono/></div></div>
<div data-tema="carta" style={{flex:1,display:'flex',flexDirection:'column',gap:18,justifyContent:'center',padding:'20px 24px',background:'var(--sfondo)',borderRadius:4}}><Logo size={48} wordmark/><div style={{display:'flex',gap:16,alignItems:'flex-end'}}><Logo size={32}/><Logo size={16}/><Logo size={32} mono/></div></div>
</div>; }
ReactDOM.createRoot(document.getElementById('root')).render(<Card/>);
</script></body></html>
